<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurasi Lokasi TJC</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--ok:#1f8a4c;--no:#b3261e;--line:#e3e1dc;--acc:#2f5d8a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0 auto 0 0}.stat{font-size:13px;color:var(--mute)}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.keep{outline:3px solid var(--ok)}.card.skip{opacity:.45}
.view{aspect-ratio:16/10;background:#ddd;display:grid;place-items:center;position:relative}
.view iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.meta{padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.country{font-weight:700;font-size:15px}.addr{color:var(--mute)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row a{font-size:12px;color:var(--acc)}
input{font:inherit;font-size:12px;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.k{color:var(--ok);border-color:var(--ok)}.s{color:var(--no);border-color:var(--no)}
</style></head><body>

let state = {};
try { state = JSON.parse(localStorage.getItem('tjc-curate') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('tjc-curate', JSON.stringify(state)); } catch (e) {} };
const st = id => state[id] || (state[id] = {});
function srcFromInput(v) {
  const m = v.match(/src="([^"]+)"/); return (m ? m[1] : v).trim();
}
function render() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  const hide = document.getElementById('hideSkip').checked;
  DATA.forEach(d => {
    const s = st(d.id);
    if (hide && s.status === 'skip') return;
    const el = document.createElement('div');
    el.className = 'card ' + (s.status || '');
    el.innerHTML = `
      <div class="view" id="v${d.id}"><button onclick="loadOne(${d.id})">Tampilkan Street View</button></div>
      <div class="meta">
        <div class="country">${d.country}</div>
        <div>${d.name}</div><div class="addr">${d.address}</div>
        <div class="row">
          <button class="k" onclick="mark(${d.id},'keep')">✓ Pakai</button>
          <button class="s" onclick="mark(${d.id},'skip')">✕ Skip</button>
          <a target="_blank" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${d.lat},${d.lng}">Cari di Google Maps ↗</a>
        </div>
        <input placeholder="Tempel kode/URL dari Share → Embed a map (opsional)" value="${s.custom || ''}"
          onchange="setCustom(${d.id}, this.value)">
      </div>`;
    g.appendChild(el);
    if (s.loaded) loadOne(d.id);
  });
  const kept = DATA.filter(d => st(d.id).status === 'keep');
  const countries = new Set(kept.map(d => d.country));
  document.getElementById('stat').textContent =
    `${kept.length} lokasi dipakai · ${countries.size} negara · ${DATA.length} kandidat`;
}
function loadOne(id) {
  const d = DATA.find(x => x.id === id), s = st(id);
  s.loaded = true; save();
  const v = document.getElementById('v' + id); if (!v) return;
  v.innerHTML = `<iframe loading="lazy" src="${s.custom || d.embed}" allowfullscreen></iframe>`;
}
function loadAll() { DATA.forEach(d => { st(d.id).loaded = true; }); save(); render(); }
function mark(id, status) { const s = st(id); s.status = s.status === status ? '' : status; save(); render(); }
function setCustom(id, v) { st(id).custom = srcFromInput(v); st(id).loaded = true; save(); render(); }
function exportJson() {
  const out = DATA.filter(d => st(d.id).status === 'keep').map(d => ({
    country: d.country, name: d.name, lat: d.lat, lng: d.lng, embed: st(d.id).custom || d.embed
  }));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'locations.json'; a.click();
}
document.getElementById('hideSkip').onchange = render;
render();
</script></body></html>
